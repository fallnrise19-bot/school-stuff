name: Apply Category Picker 0.1.8

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-category-picker-018.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch category dropdown and emoji picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/ca/creativepixels/schoolstuff/SchoolStuffApp.kt')
          text = path.read_text()

          def require(value, label):
              if value not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')

          # Imports for Material 3 exposed dropdown menus.
          import_anchor = 'import androidx.compose.material3.ExperimentalMaterial3Api\n'
          if 'import androidx.compose.material3.ExposedDropdownMenuBox\n' not in text:
              require(import_anchor, 'ExperimentalMaterial3Api import')
              text = text.replace(
                  import_anchor,
                  import_anchor
                  + 'import androidx.compose.material3.DropdownMenuItem\n'
                  + 'import androidx.compose.material3.ExposedDropdownMenuBox\n'
                  + 'import androidx.compose.material3.ExposedDropdownMenuDefaults\n',
                  1
              )

          # Render a selected emoji in school-item rows. Existing items still use prototype artwork.
          art_line = '        MockupArtImage(categoryArt(item), modifier = Modifier.size(36.dp), contentDescription = item.category)\n'
          require(art_line, 'SchoolRow artwork')
          emoji_row = (
              '        val itemEmoji = item.emoji.orEmpty()\n'
              '        if (itemEmoji.isNotBlank()) {\n'
              '            Surface(color = SoftYellow, shape = RoundedCornerShape(12.dp)) {\n'
              '                Box(Modifier.size(38.dp), contentAlignment = Alignment.Center) {\n'
              '                    Text(itemEmoji, fontSize = 23.sp)\n'
              '                }\n'
              '            }\n'
              '        } else {\n'
              '            MockupArtImage(categoryArt(item), modifier = Modifier.size(36.dp), contentDescription = item.category)\n'
              '        }\n'
          )
          text = text.replace(art_line, emoji_row, 1)

          # State used by custom categories and emoji selection.
          state_anchor = '    var showDatePicker by remember { mutableStateOf(false) }\n'
          require(state_anchor, 'date picker state')
          text = text.replace(
              state_anchor,
              state_anchor
              + '    val customCategoryOption = "__CUSTOM__"\n'
              + '    var categoryMenuExpanded by remember { mutableStateOf(false) }\n'
              + '    var customCategory by remember { mutableStateOf("") }\n'
              + '    var selectedEmoji by remember { mutableStateOf("") }\n'
              + '    var showEmojiPicker by remember { mutableStateOf(false) }\n'
              + '    val emojiChoices = listOf(\n'
              + '        "🎒", "📚", "✏️", "📝", "📄",\n'
              + '        "🍕", "🥪", "🍎", "🥛", "🧁",\n'
              + '        "⚽", "🏀", "🏃", "👟", "🏊",\n'
              + '        "🎨", "🎭", "🎵", "📷", "⭐",\n'
              + '        "🚌", "🏫", "🔬", "💻", "🧪",\n'
              + '        "👕", "🎉", "📌", "⏰", "❤️"\n'
              + '    )\n',
              1
          )

          # Replace the entire old category-chip section up to the Date heading.
          category_start = '                Text("Category", color = Ink, fontWeight = FontWeight.Bold)\n'
          date_heading = '                Text("Date", color = Ink, fontWeight = FontWeight.Bold)\n'
          require(category_start, 'Category heading')
          require(date_heading, 'Date heading')
          start = text.index(category_start)
          end = text.index(date_heading, start)
          category_ui = '''                Text("Category", color = Ink, fontWeight = FontWeight.Bold)
                ExposedDropdownMenuBox(
                    expanded = categoryMenuExpanded,
                    onExpandedChange = { categoryMenuExpanded = !categoryMenuExpanded },
                    modifier = Modifier.fillMaxWidth()
                ) {
                    OutlinedTextField(
                        value = if (category == customCategoryOption) "Custom…" else category,
                        onValueChange = { },
                        readOnly = true,
                        modifier = Modifier.menuAnchor().fillMaxWidth(),
                        trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = categoryMenuExpanded) },
                        singleLine = true
                    )
                    ExposedDropdownMenu(
                        expanded = categoryMenuExpanded,
                        onDismissRequest = { categoryMenuExpanded = false }
                    ) {
                        Category.all.forEach { cat ->
                            DropdownMenuItem(
                                text = { Text(cat) },
                                leadingIcon = { Icon(categoryIcon(cat), contentDescription = null, modifier = Modifier.size(20.dp)) },
                                onClick = {
                                    category = cat
                                    categoryMenuExpanded = false
                                }
                            )
                        }
                        DropdownMenuItem(
                            text = { Text("Custom…") },
                            leadingIcon = { Text("✨", fontSize = 20.sp) },
                            onClick = {
                                category = customCategoryOption
                                categoryMenuExpanded = false
                            }
                        )
                    }
                }
                if (category == customCategoryOption) {
                    OutlinedTextField(
                        value = customCategory,
                        onValueChange = { customCategory = it },
                        modifier = Modifier.fillMaxWidth(),
                        label = { Text("Custom category") },
                        placeholder = { Text("e.g. Field Trip, Club, Fundraiser") },
                        singleLine = true
                    )
                }
                Text("Emoji (optional)", color = Ink, fontWeight = FontWeight.Bold)
                OutlinedButton(
                    onClick = { showEmojiPicker = true },
                    modifier = Modifier.fillMaxWidth(),
                    shape = RoundedCornerShape(16.dp),
                    contentPadding = PaddingValues(horizontal = 14.dp, vertical = 10.dp)
                ) {
                    Text(if (selectedEmoji.isBlank()) "🙂" else selectedEmoji, fontSize = 25.sp)
                    Spacer(Modifier.width(10.dp))
                    Text(
                        if (selectedEmoji.isBlank()) "Choose an emoji" else "Change emoji",
                        modifier = Modifier.weight(1f)
                    )
                }
'''
          text = text[:start] + category_ui + text[end:]

          # Persist both the custom category and optional emoji.
          old_save = '                        vm.addItem(SchoolItem(childId = childId, title = title.trim(), category = category, dateIso = date.toString(), repeat = repeat, reminder = reminder, notes = notes.trim(), needsItemFromHome = needsHome))\n'
          require(old_save, 'SchoolItem save call')
          new_save = (
              '                        val finalCategory = if (category == customCategoryOption) customCategory.trim().ifBlank { "Other" } else category\n'
              '                        vm.addItem(SchoolItem(childId = childId, title = title.trim(), category = finalCategory, emoji = selectedEmoji.takeIf { it.isNotBlank() }, dateIso = date.toString(), repeat = repeat, reminder = reminder, notes = notes.trim(), needsItemFromHome = needsHome))\n'
          )
          text = text.replace(old_save, new_save, 1)

          # Add the emoji selector dialog immediately before the existing date picker.
          picker_anchor = '\n    if (showDatePicker) {\n'
          require(picker_anchor, 'DatePicker dialog')
          emoji_dialog = '''
    if (showEmojiPicker) {
        AlertDialog(
            onDismissRequest = { showEmojiPicker = false },
            title = { Text("Choose an emoji") },
            text = {
                Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                    Text(
                        "Pick something that will make this school thing easy to spot.",
                        color = Ink.copy(alpha = .65f),
                        fontSize = 13.sp
                    )
                    Spacer(Modifier.height(4.dp))
                    emojiChoices.chunked(5).forEach { emojiRow ->
                        Row(
                            Modifier.fillMaxWidth(),
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            emojiRow.forEach { emoji ->
                                TextButton(
                                    onClick = {
                                        selectedEmoji = emoji
                                        showEmojiPicker = false
                                    },
                                    modifier = Modifier.size(46.dp),
                                    contentPadding = PaddingValues(0.dp)
                                ) {
                                    Text(emoji, fontSize = 25.sp)
                                }
                            }
                        }
                    }
                }
            },
            confirmButton = {
                TextButton(onClick = { showEmojiPicker = false }) { Text("Close") }
            },
            dismissButton = {
                TextButton(
                    onClick = {
                        selectedEmoji = ""
                        showEmojiPicker = false
                    }
                ) { Text("No emoji") }
            }
        )
    }
'''
          text = text.replace(picker_anchor, emoji_dialog + picker_anchor, 1)

          path.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolStuff-0.1.8-build9-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit successful category picker build
        shell: bash
        run: |
          git config user.name "fallnrise19-bot"
          git config user.email "fall.n.rise19@gmail.com"
          git add app/src/main/java/ca/creativepixels/schoolstuff/SchoolStuffApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "Add category dropdown custom category and emoji picker"
            git push
          fi
