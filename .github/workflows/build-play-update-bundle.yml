name: Build ParentBell Play Update Bundle

on:
  push:
    branches: [ "main" ]

jobs:
  build-play-update:
    if: github.event.head_commit.message == 'Organize the child profile sections'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        run: |
          ANDROID_SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$ANDROID_SDK_MANAGER"
          "$ANDROID_SDK_MANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build release bundle
        run: gradle :app:testDebugUnitTest :app:bundleRelease --stacktrace

      - name: Upload unsigned bundle for secure local signing
        uses: actions/upload-artifact@v4
        with:
          name: ParentBell-unsigned-play-bundle-build38
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
