name: Apply Date Picker 0.1.7

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-date-picker-017.yml"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Add School Thing date selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/ca/creativepixels/schoolstuff/SchoolStuffApp.kt')
          text = app.read_text()

          old_state = '''    var needsHome by remember { mutableStateOf(false) }\n'''
          new_state = '''    var needsHome by remember { mutableStateOf(false) }\n    var showDatePicker by remember { mutableStateOf(false) }\n'''
          if old_state not in text:
              raise SystemExit('Could not find AddThingScreen state block')
          text = text.replace(old_state, new_state, 1)

          old_date = '''                Text("Date", color = Ink, fontWeight = FontWeight.Bold)\n                Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                    OutlinedButton(onClick = { date = date.minusDays(1) }) { Text("−") }\n                    Text(date.format(DateTimeFormatter.ofLocalizedDate(FormatStyle.MEDIUM)), color = Ink, modifier = Modifier.weight(1f))\n                    OutlinedButton(onClick = { date = date.plusDays(1) }) { Text("+") }\n                }\n'''
          new_date = '''                Text("Date", color = Ink, fontWeight = FontWeight.Bold)\n                OutlinedButton(\n                    onClick = { showDatePicker = true },\n                    modifier = Modifier.fillMaxWidth(),\n                    shape = RoundedCornerShape(16.dp),\n                    contentPadding = PaddingValues(horizontal = 14.dp, vertical = 12.dp)\n                ) {\n                    Icon(Icons.Rounded.CalendarMonth, contentDescription = null)\n                    Spacer(Modifier.width(10.dp))\n                    Column(Modifier.weight(1f), horizontalAlignment = Alignment.Start) {\n                        Text(\n                            date.format(DateTimeFormatter.ofPattern("EEEE, MMMM d, yyyy")),\n                            color = Ink,\n                            fontWeight = FontWeight.SemiBold\n                        )\n                        Text("Tap to choose a date", color = Ink.copy(alpha = .55f), fontSize = 12.sp)\n                    }\n                }\n'''
          if old_date not in text:
              raise SystemExit('Could not find old plus/minus date selector')
          text = text.replace(old_date, new_date, 1)

          marker = '''    }\n}\n\n@Composable\nprivate fun CalendarScreen(vm: SchoolStuffViewModel) {\n'''
          dialog = '''    }\n\n    if (showDatePicker) {\n        val datePickerState = androidx.compose.material3.rememberDatePickerState(\n            initialSelectedDateMillis = date\n                .atStartOfDay(java.time.ZoneOffset.UTC)\n                .toInstant()\n                .toEpochMilli()\n        )\n\n        androidx.compose.material3.DatePickerDialog(\n            onDismissRequest = { showDatePicker = false },\n            confirmButton = {\n                TextButton(\n                    onClick = {\n                        datePickerState.selectedDateMillis?.let { millis ->\n                            date = java.time.Instant\n                                .ofEpochMilli(millis)\n                                .atZone(java.time.ZoneOffset.UTC)\n                                .toLocalDate()\n                        }\n                        showDatePicker = false\n                    }\n                ) { Text("Choose") }\n            },\n            dismissButton = {\n                TextButton(onClick = { showDatePicker = false }) { Text("Cancel") }\n            }\n        ) {\n            androidx.compose.material3.DatePicker(\n                state = datePickerState,\n                showModeToggle = true\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun CalendarScreen(vm: SchoolStuffViewModel) {\n'''
          if marker not in text:
              raise SystemExit('Could not find AddThingScreen closing marker')
          text = text.replace(marker, dialog, 1)
          app.write_text(text)

          gradle = Path('app/build.gradle.kts')
          build = gradle.read_text()
          if 'versionCode = 7' not in build or 'versionName = "0.1.6"' not in build:
              raise SystemExit('Unexpected version before date picker patch')
          build = build.replace('versionCode = 7', 'versionCode = 8', 1)
          build = build.replace('versionName = "0.1.6"', 'versionName = "0.1.7"', 1)
          gradle.write_text(build)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolStuff-0.1.7-build8-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit successful date picker build
        shell: bash
        run: |
          rm .github/workflows/apply-date-picker-017.yml
          git config user.name "fallnrise19-bot"
          git config user.email "fall.n.rise19@gmail.com"
          git add app/src/main/java/ca/creativepixels/schoolstuff/SchoolStuffApp.kt app/build.gradle.kts .github/workflows/apply-date-picker-017.yml
          git commit -m "Replace plus minus date control with calendar picker"
          git push
